<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Line Ready">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<script>try{var t=localStorage.getItem("line-ready-theme");if(t==="classic"||t==="glass")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="themes.css">
<title>Settings · Line Ready</title>
</head>
<body>
<header class="titlebar">
  <button class="iconbtn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="drawer" aria-expanded="false"></button>
  <h1>Settings</h1>
</header>

<h2>About</h2>
<div class="card">
  <div class="row"><span>Development</span><span>Developed with AI</span></div>
  <div class="row"><span>License</span><a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0-1.0</a></div>
  <div class="note">Line Ready was developed with AI. It is released under the CC0 1.0 Universal (CC0-1.0) public domain dedication.</div>
</div>

<h2>Theme</h2>
<div class="card" role="radiogroup" aria-label="Theme">
  <label class="row"><span>Default</span><input type="radio" name="theme" value="default"></label>
  <label class="row"><span>Classic 2000s</span><input type="radio" name="theme" value="classic"></label>
  <label class="row"><span>Liquid Glass</span><input type="radio" name="theme" value="glass"></label>
  <div class="note">The theme changes appearance only. It is saved on this device.</div>
</div>

<script>
"use strict";
const THEME_KEY = "line-ready-theme";
const THEMES = ["default", "classic", "glass"];
const radios = document.querySelectorAll('input[name="theme"]');

function savedTheme() {
  try { const t = localStorage.getItem(THEME_KEY); return THEMES.includes(t) ? t : "default"; } catch (_) { return "default"; }
}
function applyTheme(name) {
  if (name !== "default") document.documentElement.setAttribute("data-theme", name);
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem(THEME_KEY, name); } catch (_) {}
}

const current = savedTheme();
radios.forEach(r => {
  r.checked = r.value === current;
  r.addEventListener("change", () => { if (r.checked) applyTheme(r.value); });
});

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
<script src="common.js"></script>
</body>
</html>
